name: Release

# Feature 017: publishes one package when release-please creates its tag.
# - verify: the tag is on the release branch, its version matches <Version>, the locked build/tests/package
#   validation pass, and the SBOM is generated.
# - publish: waits for approval in the protected `nuget` environment, attests provenance and SBOM, and pushes with
#   NuGet Trusted Publishing (short-lived key, no stored secret). The file name is referenced by the nuget.org
#   Trusted Publishing policy: do not rename it.
on:
  push:
    tags:
      - 'core-v*'
      - 'mediators-v*'
      - 'mvc-v*'
      - 'openapi-v*'
      - 'openapi-swashbuckle-v*'
      - 'aspnetcore-v*'

permissions:
  contents: read

env:
  RELEASE_BRANCH: main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      project: ${{ steps.resolve.outputs.project }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tag must be on the release branch
        run: |
          set -euo pipefail
          git fetch origin "$RELEASE_BRANCH"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$RELEASE_BRANCH"; then
            echo "::error::Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on $RELEASE_BRANCH"
            exit 1
          fi

      - name: Resolve package from tag
        id: resolve
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # Longest slug first (openapi-swashbuckle before openapi).
          case "$TAG" in
            core-v*)                SLUG="core";                PROJECT="src/Viana.Results/Viana.Results.csproj" ;;
            mediators-v*)           SLUG="mediators";           PROJECT="src/Viana.Results.Mediators/Viana.Results.Mediators.csproj" ;;
            mvc-v*)                 SLUG="mvc";                 PROJECT="src/Viana.Results.Mvc/Viana.Results.Mvc.csproj" ;;
            openapi-swashbuckle-v*) SLUG="openapi-swashbuckle"; PROJECT="src/Viana.Results.OpenApi.Swashbuckle/Viana.Results.OpenApi.Swashbuckle.csproj" ;;
            openapi-v*)             SLUG="openapi";             PROJECT="src/Viana.Results.OpenApi/Viana.Results.OpenApi.csproj" ;;
            aspnetcore-v*)          SLUG="aspnetcore";          PROJECT="src/Viana.Results.AspNetCore/Viana.Results.AspNetCore.csproj" ;;
            *) echo "::error::Unrecognized tag format: $TAG"; exit 1 ;;
          esac
          {
            echo "slug=$SLUG"
            echo "version=${TAG#${SLUG}-v}"
            echo "project=$PROJECT"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x

      - name: Restore (locked)
        run: dotnet restore Viana.Results.slnx --locked-mode

      - name: Version must match csproj
        run: |
          set -euo pipefail
          CSPROJ_VERSION=$(dotnet msbuild "${{ steps.resolve.outputs.project }}" -getProperty:Version -nologo | tr -d '[:space:]')
          if [ "$CSPROJ_VERSION" != "${{ steps.resolve.outputs.version }}" ]; then
            echo "::error::Tag version (${{ steps.resolve.outputs.version }}) does not match csproj <Version> ($CSPROJ_VERSION)"
            exit 1
          fi

      - name: Build
        run: dotnet build Viana.Results.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Viana.Results.slnx --configuration Release --no-build

      # Package validation compares the public API with the previous released version of this package.
      - name: Pack (with package validation)
        run: |
          set -euo pipefail
          SLUG="${{ steps.resolve.outputs.slug }}"
          PROJECT="${{ steps.resolve.outputs.project }}"
          BASELINE=$(git tag --list "${SLUG}-v*" --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -1 | sed "s/^${SLUG}-v//")
          # Restores and builds the project so the baseline package is downloaded; the baseline is scoped to it.
          dotnet pack "$PROJECT" --configuration Release -p:RestoreLockedMode=true -p:ContinuousIntegrationBuild=true \
            -p:VianaValidationProject="$(basename "$PROJECT" .csproj)" -p:VianaValidationBaseline="$BASELINE" -o ./artifacts

      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: ./artifacts/sbom.spdx.json
          upload-artifact: false

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          path: ./artifacts
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: nuget
    permissions:
      contents: write        # upload assets to the release created by release-please
      id-token: write        # NuGet Trusted Publishing and attestations
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: ./artifacts

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ./artifacts/*.nupkg

      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: ./artifacts/*.nupkg
          sbom-path: ./artifacts/sbom.spdx.json

      # Log in right before pushing: the key lives one hour.
      - name: NuGet login (Trusted Publishing)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Upload assets to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" ./artifacts/*.nupkg ./artifacts/*.snupkg ./artifacts/sbom.spdx.json \
            --repo "$GITHUB_REPOSITORY" --clobber

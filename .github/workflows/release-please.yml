name: Release Please

# Feature 017: one release PR per cycle, carrying every package that changed (path based, Conventional Commits).
# Merging it makes release-please create one `<component>-v<version>` tag and GitHub release per package, then
# the `publish` job publishes all of them in a single run, with a single approval.
# - A GitHub App token is used because GITHUB_TOKEN events do not start other workflows.
# - The nuget.org Trusted Publishing policy must name THIS workflow file (release-please.yml) and the `nuget`
#   environment: do not rename it.
on:
  push:
    branches: [main]
  # Recovery: publish releases that release-please already created (tags and GitHub releases exist) when the
  # publish job failed. Run it from `main`: versions come from .release-please-manifest.json at that commit.
  workflow_dispatch:
    inputs:
      paths:
        description: JSON array of package paths to publish (the tags must already exist)
        required: true
        default: '["src/Viana.Results","src/Viana.Results.Mvc","src/Viana.Results.Mediators","src/Viana.Results.OpenApi","src/Viana.Results.OpenApi.Swashbuckle","src/Viana.Results.AspNetCore"]'

permissions:
  contents: read

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - name: App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    # always(): on workflow_dispatch the release-please job is skipped, which would otherwise skip this job too.
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.releases_created == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: nuget
    permissions:
      contents: write        # upload assets to the GitHub releases created by release-please
      id-token: write        # NuGet Trusted Publishing and attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x

      - name: Restore (locked)
        run: dotnet restore Viana.Results.slnx --locked-mode

      - name: Build
        run: dotnet build Viana.Results.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Viana.Results.slnx --configuration Release --no-build

      # One pack per released package, with package validation against its previous release.
      - name: Pack released packages
        id: pack
        env:
          PATHS: ${{ github.event_name == 'workflow_dispatch' && inputs.paths || needs.release-please.outputs.paths_released }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          : > released-tags.txt
          for P in $(echo "$PATHS" | jq -r '.[]'); do
            COMPONENT=$(jq -r --arg p "$P" '.packages[$p].component' release-please-config.json)
            VERSION=$(jq -r --arg p "$P" '.[$p]' .release-please-manifest.json)
            NAME=$(basename "$P")
            PROJECT="$P/$NAME.csproj"
            TAG="${COMPONENT}-v${VERSION}"
            # `|| true`: a package with no previous release (grep finds nothing) has no baseline; with pipefail,
            # grep's exit code 1 would otherwise stop the whole step silently.
            BASELINE=$( (git tag --list "${COMPONENT}-v*" --sort=-v:refname | grep -v "^${TAG}$" || true) | head -1 | sed "s/^${COMPONENT}-v//")
            echo "::group::$NAME $VERSION (tag $TAG, baseline ${BASELINE:-none})"
            dotnet pack "$PROJECT" --configuration Release -p:GeneratePackageOnBuild=false -p:RestoreLockedMode=true \
              -p:ContinuousIntegrationBuild=true -p:VianaValidationProject="$NAME" -p:VianaValidationBaseline="$BASELINE" \
              -o "./artifacts/$TAG"
            echo "::endgroup::"
            echo "$TAG" >> released-tags.txt
          done
          echo "Released: $(tr '\n' ' ' < released-tags.txt)"

      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: ./sbom.spdx.json
          upload-artifact: false

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ./artifacts/**/*.nupkg

      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: ./artifacts/**/*.nupkg
          sbom-path: ./sbom.spdx.json

      # Log in right before pushing: the key lives one hour.
      - name: NuGet login (Trusted Publishing)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          # The matching .snupkg next to each .nupkg is pushed automatically.
          find ./artifacts -name '*.nupkg' -print0 | while IFS= read -r -d '' PKG; do
            dotnet nuget push "$PKG" --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

      - name: Upload assets to each GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while read -r TAG; do
            gh release upload "$TAG" ./artifacts/"$TAG"/* ./sbom.spdx.json --repo "$GITHUB_REPOSITORY" --clobber
          done < released-tags.txt
